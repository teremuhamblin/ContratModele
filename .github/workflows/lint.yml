name: Vérification Markdown & Liens

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les liens internes et l'avertissement juridique
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import re, sys

          root = Path(".")
          link_re = re.compile(r"\[[^\]]+\]\(([^)#]+)(?:#[^)]+)?\)")
          errors = []

          for md in [root / "README.md", *sorted((root / "DOCS").glob("*.md"))]:
              if not md.exists():
                  continue
              text = md.read_text(encoding="utf-8")
              for target in link_re.findall(text):
                  if target.startswith(("http://", "https://", "mailto:")):
                      continue
                  resolved = (md.parent / target).resolve()
                  if not resolved.exists():
                      errors.append(f"Lien cassé dans {md}: {target}")

              if md.parent.name == "DOCS" and md.name not in {"LICENSE.md", "README.md", "checklist-avant-signature.md"}:
                  if "Avertissement" not in text:
                      errors.append(f"Avertissement juridique manquant dans {md}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Toutes les vérifications ContratModele ont réussi !")
          EOF
